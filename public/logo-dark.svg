<svg xmlns="http://www.w3.org/2000/svg" width="168" height="48" viewBox="0 0 168 48" fill="none" role="img" aria-label="ExportBox">
  <defs>
    <linearGradient id="eb-logo-grad-dark" x1="4" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78B0FB" />
      <stop offset="1" stop-color="#3D82DC" />
    </linearGradient>
  </defs>

  <!-- 图标：圆角方框（箱体）+ 向外斜上的箭头（出口） -->
  <rect x="2" y="4" width="40" height="40" rx="12" fill="url(#eb-logo-grad-dark)" />
  <path d="M14 27.5 L25.5 16" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
  <path d="M18.5 14.5 H27 V23" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 字标：深色模式下 Export 用亮白，Box 用浅蓝 -->
  <text
    x="52"
    y="31"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="21"
    font-weight="700"
    letter-spacing="-0.6"
  >
    <tspan fill="#F8FAFC">Export</tspan><tspan fill="#9EC8FF">Box</tspan>
  </text>
</svg>
