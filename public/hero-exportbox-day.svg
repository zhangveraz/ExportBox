<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroDayBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcff" />
      <stop offset="0.55" stop-color="#eff6ff" />
      <stop offset="1" stop-color="#e4f0ff" />
    </linearGradient>
    <radialGradient id="heroDayGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9e2ff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#c9e2ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="heroDayGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8d0ff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#a8d0ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="heroDayArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78b0fb" stop-opacity="0" />
      <stop offset="0.5" stop-color="#78b0fb" stop-opacity="0.45" />
      <stop offset="1" stop-color="#78b0fb" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="heroDayGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#78b0fb" stroke-opacity="0.11" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#heroDayBg)" />
  <rect width="1600" height="900" fill="url(#heroDayGrid)" />

  <circle cx="1340" cy="140" r="430" fill="url(#heroDayGlow1)" />
  <circle cx="160" cy="780" r="390" fill="url(#heroDayGlow2)" />

  <!-- 航线弧线 -->
  <g fill="none" stroke="url(#heroDayArc)" stroke-width="1.8" stroke-linecap="round">
    <path d="M1020 700 C 1180 552, 1340 512, 1540 556" />
    <path d="M950 768 C 1140 636, 1330 610, 1570 672" />
    <path d="M1100 620 C 1250 500, 1400 470, 1580 500" stroke-opacity="0.3" />
  </g>

  <!-- 节点 -->
  <g fill="#78b0fb">
    <circle cx="1020" cy="700" r="4.5" fill-opacity="0.7" />
    <circle cx="1540" cy="556" r="4.5" fill-opacity="0.7" />
    <circle cx="950" cy="768" r="4" fill-opacity="0.55" />
    <circle cx="1570" cy="672" r="4" fill-opacity="0.55" />
    <circle cx="1100" cy="620" r="3.5" fill-opacity="0.45" />
    <circle cx="1580" cy="500" r="3.5" fill-opacity="0.45" />
  </g>

  <!-- 右下角极淡的光带 -->
  <path d="M900 900 C 1150 790, 1400 760, 1600 800 L1600 900 Z" fill="#dcebff" fill-opacity="0.55" />
</svg>
